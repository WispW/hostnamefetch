name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes shellcheck
          fi
          shellcheck hostnamefetch tests/smoke.sh packaging/aur/update.sh

  ubuntu:
    name: Ubuntu
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax check
        run: |
          bash -n hostnamefetch
          bash -n tests/smoke.sh
          bash -n packaging/aur/update.sh

      - name: Smoke tests
        run: bash tests/smoke.sh

  windows:
    name: Windows (PowerShell)
    needs: ubuntu
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Environment
        run: |
          $bash = Join-Path $env:ProgramFiles "Git\bin\bash.exe"
          if (-not (Test-Path $bash)) { throw "Git Bash not found: $bash" }
          & $bash --version
          & $bash -c 'uname -a'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Syntax check
        run: |
          $bash = Join-Path $env:ProgramFiles "Git\bin\bash.exe"
          if (-not (Test-Path $bash)) { throw "Git Bash not found: $bash" }
          & $bash -n hostnamefetch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $bash -n tests/smoke.sh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke tests
        run: |
          $bash = Join-Path $env:ProgramFiles "Git\bin\bash.exe"
          if (-not (Test-Path $bash)) { throw "Git Bash not found: $bash" }
          & $bash tests/smoke.sh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  arch:
    name: Arch Linux (container)
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Smoke tests
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/src" \
            --workdir /src \
            archlinux:latest \
            bash -c 'bash -n hostnamefetch && bash -n tests/smoke.sh && bash tests/smoke.sh'

  macos:
    name: macOS
    needs: arch
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bash
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install bash

      - name: Environment
        run: |
          BASH5="$(brew --prefix)/bin/bash"
          "$BASH5" --version
          sw_vers
          uname -a

      - name: Syntax check
        run: |
          BASH5="$(brew --prefix)/bin/bash"
          "$BASH5" -n hostnamefetch
          "$BASH5" -n tests/smoke.sh

      - name: Smoke tests
        run: |
          BASH5="$(brew --prefix)/bin/bash"
          "$BASH5" tests/smoke.sh

      - name: Sample output
        run: |
          BASH5="$(brew --prefix)/bin/bash"
          "$BASH5" hostnamefetch --stdout --disable cols
