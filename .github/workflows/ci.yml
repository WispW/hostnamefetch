name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes shellcheck
          fi
          shellcheck hostnamefetch tests/smoke.sh packaging/apt/build-deb.sh

  ubuntu:
    name: Ubuntu
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: windows/go.mod
          cache: false

      - name: Syntax check
        run: |
          bash -n hostnamefetch
          bash -n tests/smoke.sh
          bash -n packaging/apt/build-deb.sh

      - name: Smoke tests
        run: bash tests/smoke.sh

      - name: Go vet and tests
        working-directory: windows
        run: |
          go vet ./...
          go test ./...

      - name: Cross-compile Windows binaries
        working-directory: windows
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o "$RUNNER_TEMP/hostnamefetch-amd64.exe" .
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o "$RUNNER_TEMP/hostnamefetch-arm64.exe" .
          ls -l "$RUNNER_TEMP"/hostnamefetch-*.exe

  windows:
    name: Windows (PowerShell)
    needs: ubuntu
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: windows/go.mod
          cache: false

      - name: Environment
        run: |
          $bash = Join-Path $env:ProgramFiles "Git\bin\bash.exe"
          if (-not (Test-Path $bash)) { throw "Git Bash not found: $bash" }
          & $bash --version
          & $bash -c 'uname -a'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Syntax check
        run: |
          $bash = Join-Path $env:ProgramFiles "Git\bin\bash.exe"
          if (-not (Test-Path $bash)) { throw "Git Bash not found: $bash" }
          & $bash -n hostnamefetch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $bash -n tests/smoke.sh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke tests
        run: |
          $bash = Join-Path $env:ProgramFiles "Git\bin\bash.exe"
          if (-not (Test-Path $bash)) { throw "Git Bash not found: $bash" }
          & $bash tests/smoke.sh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build native exe
        working-directory: windows
        run: go build -trimpath -ldflags "-s -w" -o hostnamefetch.exe .

      - name: Native exe smoke tests
        working-directory: windows
        run: |
          $exe = Join-Path $PWD "hostnamefetch.exe"

          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version failed" }

          $out = & $exe --stdout
          if ($LASTEXITCODE -ne 0) { throw "--stdout failed" }
          if (-not ($out -match '^Hostname: ')) { throw "missing Hostname row" }
          if (-not ($out -match '^OS: Windows ')) { throw "missing OS row" }

          & $exe --layout top --banner_chars ascii | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "top layout failed" }

          & $exe --layout left --disable memory uptime | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "left layout failed" }

          & $exe --bogus 2>$null
          if ($LASTEXITCODE -ne 1) { throw "invalid option should exit 1" }

          # The assertion above leaves $LASTEXITCODE at 1; without this the
          # step would inherit that as its own exit code and fail.
          exit 0

      - name: Installer test
        working-directory: windows
        run: |
          $exe = Join-Path $PWD "hostnamefetch.exe"
          $sum = Join-Path $PWD "hostnamefetch.exe.sha256"
          $installer = Join-Path $PWD "install.ps1"
          $installDir = Join-Path $env:RUNNER_TEMP "hostnamefetch-install-test"

          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText($sum, "$hash  hostnamefetch.exe" + [Environment]::NewLine, [Text.Encoding]::ASCII)

          Remove-Item -LiteralPath $installDir -Recurse -Force -ErrorAction SilentlyContinue

          & $installer -Action Install -InstallDir $installDir -NoPath -AssetPath $exe -ChecksumPath $sum
          if (-not (Test-Path -LiteralPath (Join-Path $installDir "hostnamefetch.exe"))) {
            throw "installer did not create hostnamefetch.exe"
          }

          & (Join-Path $installDir "hostnamefetch.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "installed exe --version failed" }

          & $installer -Action Update -InstallDir $installDir -NoPath -AssetPath $exe -ChecksumPath $sum -Force
          & $installer -Action Uninstall -InstallDir $installDir -NoPath
          if (Test-Path -LiteralPath $installDir) {
            throw "installer did not remove install directory"
          }

  arch:
    name: Arch Linux (container)
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Smoke tests
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/src" \
            --workdir /src \
            archlinux:latest \
            bash -c 'bash -n hostnamefetch && bash -n tests/smoke.sh && bash tests/smoke.sh'

  macos:
    name: macOS
    needs: arch
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bash
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install bash

      - name: Environment
        run: |
          BASH5="$(brew --prefix)/bin/bash"
          "$BASH5" --version
          sw_vers
          uname -a

      - name: Syntax check
        run: |
          BASH5="$(brew --prefix)/bin/bash"
          "$BASH5" -n hostnamefetch
          "$BASH5" -n tests/smoke.sh

      - name: Smoke tests
        run: |
          BASH5="$(brew --prefix)/bin/bash"
          "$BASH5" tests/smoke.sh

      - name: Sample output
        run: |
          BASH5="$(brew --prefix)/bin/bash"
          "$BASH5" hostnamefetch --stdout --disable cols

  apt:
    name: APT package
    needs: macos
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential debhelper devscripts fakeroot lintian

      - name: Build package
        run: packaging/apt/build-deb.sh --worktree

      - name: Lint package
        run: lintian packaging/apt/dist/hostnamefetch.deb

      - name: Install package
        run: |
          docker run --rm -v "$PWD/packaging/apt/dist:/dist:ro" ubuntu:latest \
            bash -c 'apt-get update -qq && \
              apt-get install -y -qq --no-install-recommends /dist/hostnamefetch.deb >/dev/null && \
              hostnamefetch --version'
